<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#102231"/>
      <stop offset="55%" stop-color="#0A1724"/>
      <stop offset="100%" stop-color="#050E16"/>
    </linearGradient>

    <linearGradient id="c-blade" x1="210" y1="70" x2="410" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#B9FFF2"/>
      <stop offset="38%"  stop-color="#5EEAD4"/>
      <stop offset="78%"  stop-color="#21BFAD"/>
      <stop offset="100%" stop-color="#0B7A72"/>
    </linearGradient>

    <radialGradient id="c-core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="22%"  stop-color="#CFFFF6"/>
      <stop offset="62%"  stop-color="#4FE3CE"/>
      <stop offset="100%" stop-color="#0E9C8E"/>
    </radialGradient>

    <radialGradient id="c-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <filter id="c-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <path id="c-bladeShape"
      d="M225.8 84.6
         A174 174 0 0 1 429.3 240.8
         C 422 256, 414.5 265, 405.4 269.1
         C 397 262, 388.5 254, 381.5 245
         A126 126 0 0 0 234.1 131.9
         C 227 117, 223.8 100, 225.8 84.6 Z"/>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#c-bg)"/>

  <!-- ambient light behind the mechanism -->
  <circle cx="256" cy="256" r="210" fill="url(#c-halo)"/>

  <!-- three metered blades, each a stage further along -->
  <g>
    <g opacity="0.30" transform="rotate(240 256 256)">
      <use href="#c-bladeShape" fill="url(#c-blade)"/>
    </g>
    <g opacity="0.62" transform="rotate(120 256 256)">
      <use href="#c-bladeShape" fill="url(#c-blade)"/>
    </g>
    <g opacity="1">
      <use href="#c-bladeShape" fill="url(#c-blade)" filter="url(#c-soft)" opacity="0.5"/>
      <use href="#c-bladeShape" fill="url(#c-blade)"/>
    </g>
  </g>

  <!-- the value held at the centre -->
  <circle cx="256" cy="256" r="52" fill="url(#c-core)" filter="url(#c-soft)" opacity="0.7"/>
  <circle cx="256" cy="256" r="40" fill="url(#c-core)"/>
  <circle cx="256" cy="256" r="40" fill="none" stroke="#EAFFFB" stroke-width="3" opacity="0.55"/>
</svg>

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#102231"/><stop offset="55%" stop-color="#0A1724"/>
      <stop offset="100%" stop-color="#050E16"/>
    </linearGradient>
    <linearGradient id="s-blade" x1="210" y1="70" x2="410" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9FFF2"/><stop offset="38%" stop-color="#5EEAD4"/>
      <stop offset="78%" stop-color="#21BFAD"/><stop offset="100%" stop-color="#0B7A72"/>
    </linearGradient>
    <radialGradient id="s-core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="22%" stop-color="#CFFFF6"/>
      <stop offset="62%" stop-color="#4FE3CE"/><stop offset="100%" stop-color="#0E9C8E"/>
    </radialGradient>
    <radialGradient id="s-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#2DD4BF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="s-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <path id="s-blade-shape"
      d="M225.8 84.6 A174 174 0 0 1 429.3 240.8
         C 422 256, 414.5 265, 405.4 269.1
         C 397 262, 388.5 254, 381.5 245
         A126 126 0 0 0 234.1 131.9
         C 227 117, 223.8 100, 225.8 84.6 Z"/>
  </defs>

  <rect width="1200" height="630" fill="url(#s-bg)"/>

  <g transform="translate(96, 148) scale(0.66)">
    <circle cx="256" cy="256" r="230" fill="url(#s-halo)"/>
    <g opacity="0.30" transform="rotate(240 256 256)"><use href="#s-blade-shape" fill="url(#s-blade)"/></g>
    <g opacity="0.62" transform="rotate(120 256 256)"><use href="#s-blade-shape" fill="url(#s-blade)"/></g>
    <g opacity="1">
      <use href="#s-blade-shape" fill="url(#s-blade)" filter="url(#s-soft)" opacity="0.5"/>
      <use href="#s-blade-shape" fill="url(#s-blade)"/>
    </g>
    <circle cx="256" cy="256" r="52" fill="url(#s-core)" filter="url(#s-soft)" opacity="0.7"/>
    <circle cx="256" cy="256" r="40" fill="url(#s-core)"/>
    <circle cx="256" cy="256" r="40" fill="none" stroke="#EAFFFB" stroke-width="3" opacity="0.55"/>
  </g>

  <text x="510" y="288" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="86" font-weight="600" letter-spacing="-2.6" fill="#F1F5F9">Secure</text>
  <text x="768" y="288" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="86" font-weight="600" letter-spacing="-2.6" fill="#2DD4BF">Flow</text>
  <text x="512" y="352" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="400" letter-spacing="4" fill="#7C99A8">MILESTONE ESCROW ON ARC</text>
  <text x="512" y="424" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="27" font-weight="400" fill="#C7D6DF">Freelance work where nobody</text>
  <text x="512" y="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="27" font-weight="400" fill="#C7D6DF">has to be trusted.</text>
</svg>

<svg width="1100" height="280" viewBox="0 0 1100 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h-blade" x1="210" y1="70" x2="410" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9FFF2"/><stop offset="38%" stop-color="#5EEAD4"/>
      <stop offset="78%" stop-color="#21BFAD"/><stop offset="100%" stop-color="#0B7A72"/>
    </linearGradient>
    <radialGradient id="h-core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="22%" stop-color="#CFFFF6"/>
      <stop offset="62%" stop-color="#4FE3CE"/><stop offset="100%" stop-color="#0E9C8E"/>
    </radialGradient>
    <radialGradient id="h-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#2DD4BF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <path id="h-blade-shape"
      d="M225.8 84.6 A174 174 0 0 1 429.3 240.8
         C 422 256, 414.5 265, 405.4 269.1
         C 397 262, 388.5 254, 381.5 245
         A126 126 0 0 0 234.1 131.9
         C 227 117, 223.8 100, 225.8 84.6 Z"/>
  </defs>

  <g transform="translate(14, 12) scale(0.45)">
    <circle cx="256" cy="256" r="210" fill="url(#h-halo)"/>
    <g opacity="0.30" transform="rotate(240 256 256)"><use href="#h-blade-shape" fill="url(#h-blade)"/></g>
    <g opacity="0.62" transform="rotate(120 256 256)"><use href="#h-blade-shape" fill="url(#h-blade)"/></g>
    <g opacity="1">
      <use href="#h-blade-shape" fill="url(#h-blade)" filter="url(#h-soft)" opacity="0.5"/>
      <use href="#h-blade-shape" fill="url(#h-blade)"/>
    </g>
    <circle cx="256" cy="256" r="52" fill="url(#h-core)" filter="url(#h-soft)" opacity="0.7"/>
    <circle cx="256" cy="256" r="40" fill="url(#h-core)"/>
    <circle cx="256" cy="256" r="40" fill="none" stroke="#EAFFFB" stroke-width="3" opacity="0.55"/>
  </g>

  <text x="282" y="140" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="82" font-weight="600" letter-spacing="-2.4" fill="#F1F5F9">Secure</text>
  <text x="530" y="140" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="82" font-weight="600" letter-spacing="-2.4" fill="#2DD4BF">Flow</text>
  <text x="284" y="192" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="400" letter-spacing="3.6" fill="#7C99A8">MILESTONE ESCROW ON ARC</text>
</svg>

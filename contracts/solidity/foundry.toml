[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
solc_version = "0.8.20"

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"

[etherscan]
arc = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.arc.io/api" }
arc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.testnet.arc.io/api" }
